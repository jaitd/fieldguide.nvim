# Through tests/docker/run.sh, the same entry point as `mise run test:linux`:
# the image has the Neovim, bwrap and installed plugin config the suite needs,
# so CI runs what a contributor runs rather than a second setup that can drift.
# The macOS half of verify (seatbelt) is not covered here.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: mise run test
        run: ./tests/docker/run.sh
